name: Daily Match Refresh

on:
  schedule:
    # 05:00 UTC = 06:00 in Nigeria (Africa/Lagos).
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-match-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Refresh today and upcoming fixtures
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python -m src.data.refresh_daily --window-days 3 --delay 1

      - name: Commit updated snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/matches_2026.csv
          if git diff --cached --quiet; then
            echo "No fixture changes to commit"
            exit 0
          fi
          git commit -m "chore(data): refresh daily fixtures"
          git push origin HEAD:main
