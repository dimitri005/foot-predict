name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest

      - name: Compile Python sources
        run: python -m compileall -q app.py src tests

      - name: Run tests
        env:
          LIVE_REFRESH_ON_STARTUP: "false"
        run: python -m pytest -q

      - name: Verify Flask health route
        run: |
          python - <<'PY'
          from app import app

          client = app.test_client()
          response = client.get('/health')
          assert response.status_code == 200
          assert response.get_json()['status'] == 'ok'
          print('Flask health route: OK')
          PY

      - name: Check tracked files for local secrets
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|.*\.pem|.*\.key)$'; then
            echo "Tracked secret-like file detected"
            exit 1
          fi
          if git grep -n -E 'FOOTBALL_DATA_API_KEY[[:space:]]*=[[:space:]]*[^[:space:]]+' -- ':!*.md'; then
            echo "Possible hard-coded API token detected"
            exit 1
          fi
